name: biue

x-app-image: &app-image
  image: biue-app:0.1.0
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  APP_PORT: "8080"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-biue}
  MYSQL_USER: ${MYSQL_USER:-biue}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先配置 MYSQL_PASSWORD}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?请先配置 REDIS_PASSWORD}
  REDIS_DB: ${REDIS_DB:-0}
  JWT_SECRET: ${JWT_SECRET:?请先生成 JWT_SECRET}
  CSRF_SECRET: ${CSRF_SECRET:?请先生成 CSRF_SECRET}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?请先生成 APP_ENCRYPTION_KEY}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.10/32}
  AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
  BCRYPT_COST: ${BCRYPT_COST:-12}
  PROBLEM_DATA_DIR: /app/oj-data/problem-data
  PROBLEM_IMPORT_CONCURRENCY: ${PROBLEM_IMPORT_CONCURRENCY:-2}
  JUDGE_QUEUE_CAPACITY: ${JUDGE_QUEUE_CAPACITY:-1000}

services:
  lang-cpp17:
    image: biue-lang-cpp17:0.1.0
    build:
      context: ..
      dockerfile: deploy/languages/Dockerfile
      args:
        LANGUAGE_IMAGE: gcc:14.2.0-bookworm
        LANGUAGE_ID: cpp17
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  lang-go:
    image: biue-lang-go:0.1.0
    build:
      context: ..
      dockerfile: deploy/languages/Dockerfile
      args:
        LANGUAGE_IMAGE: golang:1.25.4-bookworm
        LANGUAGE_ID: go
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  lang-python3:
    image: biue-lang-python3:0.1.0
    build:
      context: ..
      dockerfile: deploy/languages/Dockerfile
      args:
        LANGUAGE_IMAGE: python:3.12.10-slim-bookworm
        LANGUAGE_ID: python3
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  lang-java:
    image: biue-lang-java:0.1.0
    build:
      context: ..
      dockerfile: deploy/languages/Dockerfile
      args:
        LANGUAGE_IMAGE: eclipse-temurin:21.0.7_6-jdk-jammy
        LANGUAGE_ID: java
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  lang-javascript:
    image: biue-lang-javascript:0.1.0
    build:
      context: ..
      dockerfile: deploy/languages/Dockerfile
      args:
        LANGUAGE_IMAGE: node:22.23.4-bookworm-slim
        LANGUAGE_ID: javascript
    entrypoint: ["/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-biue}
      MYSQL_USER: ${MYSQL_USER:-biue}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先配置 MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --user=\"$${MYSQL_USER}\" --host=127.0.0.1 --database=\"$${MYSQL_DATABASE}\" --batch --silent --execute='SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4.11-alpine3.21
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请先配置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app-image
    restart: "no"
    environment: *app-environment
    entrypoint: ["/app/ojctl"]
    command: ["migrate", "up"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      disable: true
    networks:
      - backend
    depends_on:
      mysql:
        condition: service_healthy

  web:
    <<: *app-image
    restart: unless-stopped
    environment: *app-environment
    read_only: true
    volumes:
      - problem-data:/app/oj-data/problem-data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  dispatcher:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-environment
      DISPATCHER_HEALTH_ADDR: "0.0.0.0:8082"
    entrypoint: ["/app/dispatcher"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/dispatcher", "--healthcheck"]
      interval: 15s
      timeout: 6s
      retries: 10

  worker:
    <<: *app-image
    restart: unless-stopped
    environment:
      <<: *app-environment
      RUNNER_URL: ${RUNNER_URL:-http://runner:8083}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?请独立生成 RUNNER_TOKEN}
      RUNNER_CA_FILE: ${RUNNER_CA_FILE:-}
      WORKER_HEALTH_ADDR: "0.0.0.0:8081"
    entrypoint: ["/app/worker"]
    read_only: true
    volumes:
      - problem-data:/app/oj-data/problem-data:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, judge]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/worker", "--healthcheck"]
      interval: 15s
      timeout: 6s
      retries: 10
    stop_grace_period: 30s

  runner:
    <<: *app-image
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?请独立生成 RUNNER_TOKEN}
      RUNNER_ADDR: "0.0.0.0:8083"
      RUNNER_DATA_DIR: /app/oj-data/runner
      DOCKER_SOCKET: /var/run/docker.sock
      JUDGE_CONCURRENCY: ${JUDGE_CONCURRENCY:-2}
      RUNNER_TLS_CERT: ${RUNNER_TLS_CERT:-}
      RUNNER_TLS_KEY: ${RUNNER_TLS_KEY:-}
      RUNNER_CA_FILE: ${RUNNER_CA_FILE:-}
    entrypoint: ["/app/judge-runner"]
    group_add:
      - "${DOCKER_GID:-0}"
    read_only: true
    volumes:
      - runner-data:/app/oj-data/runner
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [judge]
    depends_on:
      lang-cpp17:
        condition: service_completed_successfully
      lang-go:
        condition: service_completed_successfully
      lang-python3:
        condition: service_completed_successfully
      lang-java:
        condition: service_completed_successfully
      lang-javascript:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/judge-runner", "--healthcheck"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 20s
    stop_grace_period: 30s

  nginx:
    image: biue-nginx:0.1.0
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PUBLIC_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      edge:
        ipv4_address: 172.30.0.10
    depends_on:
      web:
        condition: service_healthy

networks:
  judge:
    internal: true
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  mysql-data:
  redis-data:
  problem-data:
  runner-data:
