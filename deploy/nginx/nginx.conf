worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format request_safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout request_safe;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 256k;

        proxy_http_version 1.1;
        # Preserve a non-default public port for the CSRF origin checks.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is a single trusted proxy; discard client-supplied chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/api/admin/problems/[0-9]+/data-versions$ {
            client_max_body_size 34m;
            # Stream so Web checks CSRF/session/role before consuming the ZIP.
            proxy_request_buffering off;
            proxy_pass http://web:8080;
        }

        location ~ ^/api/contests/[0-9]+/csv/preview$ {
            client_max_body_size 1m;
            proxy_request_buffering off;
            proxy_pass http://web:8080;
        }

        location / {
            proxy_pass http://web:8080;
        }
    }
}
